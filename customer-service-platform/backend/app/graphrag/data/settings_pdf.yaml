### PDF 处理专用 GraphRAG 配置文件
### 敏感信息和路径应通过环境变量覆盖

### LLM settings ###
models:
  default_chat_model:
    type: openai_chat
    api_base: ${GRAPHRAG_API_BASE}
    auth_type: api_key
    api_key: ${GRAPHRAG_API_KEY}
    model: ${GRAPHRAG_MODEL_NAME}
    encoding_model: cl100k_base
    concurrent_requests: 25
    async_mode: threaded
    retry_strategy: native
    max_retries: 3
    tokens_per_minute: 0
    requests_per_minute: 0
  
  default_embedding_model:
    type: openai_embedding
    api_base: ${EMBEDDING_API_BASE}
    auth_type: api_key
    api_key: ${EMBEDDING_API_KEY}
    model: ${EMBEDDING_MODEL_NAME}
    encoding_model: cl100k_base
    model_supports_json: true
    concurrent_requests: 25
    async_mode: threaded
    retry_strategy: native
    max_retries: 3
    tokens_per_minute: 0
    requests_per_minute: 0

vector_store:
  default_vector_store:
    type: lancedb
    db_uri: output/pdf_lancedb
    container_name: pdf_default
    overwrite: true

embed_text:
  model_id: default_embedding_model
  vector_store_id: default_vector_store

## Input settings ###
input:
  type: file
  file_type: pdf
  base_dir: "input"
  file_encoding: utf-8
  file_pattern: ".*\\.pdf$$"
  local_output_dir: "${PDF_OUTPUT_DIR:-./data/pdf_outputs}"
  mineru_api_url: "${MINERU_API_URL:http://localhost:8000/}"
  mineru_output_dir: "${MINERU_OUTPUT_DIR:/tmp/mineru_output}"
  table_description_api_key: ${TABLE_DESCRIPTION_API_KEY}
  table_description_model: ${TABLE_DESCRIPTION_MODEL:deepseek-chat}
  base_url: ${TABLE_DESCRIPTION_BASE_URL:https://api.deepseek.com}
  image_description_api_key: ${IMAGE_DESCRIPTION_API_KEY}
  image_description_model: ${IMAGE_DESCRIPTION_MODEL:gpt-4o}
  image_description_base_url: ${IMAGE_DESCRIPTION_BASE_URL:https://ai.devtool.tech/proxy/v1}

chunks:
  strategy: markdown
  size: 500
  overlap: 100
  group_by_columns: [id]

### Output settings ###
cache:
  type: file
  base_dir: "pdf_cache"

reporting:
  type: file
  base_dir: "pdf_logs"

output:
  type: file
  base_dir: "pdf_output"

### Workflow settings ###
extract_graph:
  model_id: default_chat_model
  prompt: "prompt_turn_output/extract_graph_pdf_zh.txt"
  entity_types: [organization, person, location, technology, product, company, service, document, course, requirement]
  max_gleanings: 1
  tuple_delimiter: "<|>"
  record_delimiter: "##"
  completion_delimiter: "<|COMPLETE|>"

summarize_descriptions:
  model_id: default_chat_model
  prompt: "prompt_turn_output/summarize_descriptions_pdf_zh.txt"
  max_length: 500

extract_graph_nlp:
  text_analyzer:
    extractor_type: regex_english

extract_claims:
  enabled: false
  model_id: default_chat_model
  prompt: "prompts/extract_claims.txt"
  description: "Any claims or facts that could be relevant to information discovery."
  max_gleanings: 1

community_reports:
  model_id: default_chat_model
  graph_prompt: "prompt_turn_output/community_report_graph_pdf_zh.txt"
  text_prompt: "prompts/community_report_text_zh.txt"
  max_length: 2000
  max_input_length: 8000

cluster_graph:
  max_cluster_size: 10

embed_graph:
  enabled: true

umap:
  enabled: false

snapshots:
  graphml: false
  embeddings: false

### Query settings ###
local_search:
  chat_model_id: default_chat_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/local_search_system_prompt.txt"

global_search:
  chat_model_id: default_chat_model
  map_prompt: "prompts/global_search_map_system_prompt.txt"
  reduce_prompt: "prompts/global_search_reduce_system_prompt.txt"
  knowledge_prompt: "prompts/global_search_knowledge_system_prompt.txt"

drift_search:
  chat_model_id: default_chat_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/drift_search_system_prompt.txt"
  reduce_prompt: "prompts/drift_search_reduce_prompt.txt"

basic_search:
  chat_model_id: default_chat_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/basic_search_system_prompt.txt"
